name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} (${{ github.sha }}) is not reachable from main; refusing to release."
            exit 1
          fi

  release:
    needs: verify-tag-on-main
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npx electron-vite build

      - name: Publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify on release failure (create GitHub issue)
        if: ${{ needs.release.result != 'success' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = github.context.ref || '';
            const refName = ref.startsWith('refs/tags/') ? ref.replace('refs/tags/', '') : ref.replace('refs/heads/', '');
            const title = `Release workflow failed for ${refName}`;
            const body = `The Release workflow run for tag \`${refName}\` (run id \`${process.env.GITHUB_RUN_ID}\`) did not succeed.\n\nRepository: ${github.context.repo.owner}/${github.context.repo.repo}\nCommit: ${process.env.GITHUB_SHA}\n\nView the run: ${process.env.GITHUB_SERVER_URL}/${github.context.repo.owner}/${github.context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}\n\nThe failing matrix job(s) may be listed in the run page above.`;
            const owner = github.context.repo.owner;
            const repo = github.context.repo.repo;
            // Look for an existing open issue with the same title
            const listResp = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = listResp.data.find(i => i.title === title);
            if (existing) {
              console.log(`Found existing issue #${existing.number}, adding a comment.`);
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Release failed again: ${body}` });
            } else {
              console.log('No existing issue found, creating one.');
              await github.rest.issues.create({ owner, repo, title, body });
            }
